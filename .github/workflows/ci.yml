name: Verification du projet

on:
    push:
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    test:
        runs-on: ubuntu-latest

        env:
            KERAS_BACKEND: tensorflow
            CUDA_VISIBLE_DEVICES: "-1"
        
        steps:
            - name: Recuperer le code
              uses: actions/checkout@v6

            - name: Installer Python
              uses: actions/setup-python@v6
              with:
                python-version: "3.14"
                cache: pip
                cache-dependency-path: |
                    requirements.txt
                    requirements-test.txt

            - name: Installer les dependances
              run: |
                python -m pip install -r requirements-test.txt
                python -m pip check

            - name: Verifier la qualite du modele
              run: python barriere_qualite.py

            - name: Executer les tests
              run: python -m pytest -v

    publier:
      needs: image
      if: github.event_name == 'push'
      runs-on: ubuntu-latest

      steps:
        - name: Recuperer l'image verifiee
          uses: actions/download-artifact@v8
          with:
            name: image-docker

        - name: Charger l'image dans Docker
          run: docker load -i films-api.tar.gz

        - name: Se connecter au registre Azure
          uses: docker/login-action@v4
          with:
            registry: ${{ secrets.ACR_LOGIN_SERVER }}
            username: ${{ secrets.ACR_USERNAME }}
            password: ${{ secrets.ACR_PASSWORD }}

        - name: Etiqueter et publier l'image
          env:
            ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}
            COMMIT_SHA: ${{ github.sha }}
          run: |
            IMAGE_DISTANTE="$ACR_LOGIN_SERVER/films-api:$COMMIT_SHA"
            docker tag "films-api:$COMMIT_SHA" "$IMAGE_DISTANTE"
            docker push "$IMAGE_DISTANTE"

    image:
        needs: test
        runs-on: ubuntu-latest

        steps:
            - name: Recuperer le code
              uses: actions/checkout@v6

            - name: Construire l'image
              run: docker build -t films-api:${{ github.sha }} .

            - name: Demarrer le conteneur
              run: |
                docker run -d --name films-api \
                    -p 127.0.0.1:8000:8000 \
                    films-api:${{ github.sha }}

            - name: Verifier que l'API demarre
              run: |
                curl --fail --show-error \
                    --retry 30 \
                    --retry-delay 2 \
                    --retry-all-errors \
                    --connect-timeout 2 \
                    --max-time 5 \
                    http://127.0.0.1:8000/health
            - name: Afficher les logs
              if: always()
              run: docker logs films-api

            - name: Arreter le conteneur
              if: always()
              run: docker rm -f films-api

            - name: Exporter l'image verifiee
              run: docker save films-api:${{ github.sha }} | gzip > films-api.tar.gz

            - name: Conserver l'image pour le job suivant
              uses: actions/upload-artifact@v7
              with:
                name: image-docker
                path: films-api.tar.gz
                compression-level: 0
                retention-days: 1
                if-no-files-found: error

