name: Verification du projet

on:
    push:
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    test:
        runs-on: ubuntu-latest

        env:
            KERAS_BACKEND: tensorflow
            CUDA_VISIBLE_DEVICES: "-1"
        
        steps:
            - name: Recuperer le code
              uses: actions/checkout@v6

            - name: Installer Python
              uses: actions/setup-python@v6
              with:
                python-version: "3.14"
                cache: pip
                cache-dependency-path: |
                    requirements.txt
                    requirements-test.txt

            - name: Installer les dependances
              run: |
                python -m pip install -r requirements-test.txt
                python -m pip check

            - name: Verifier la qualite du modele
              run: python barriere_qualite.py

            - name: Executer les tests
              run: python -m pytest -v

    image:
        needs: test
        runs-on: ubuntu-latest

        steps:
            - name: Recuperer le code
              uses: actions/checkout@v6

            - name: Construire l'image
              run: docker build -t films-api:${{ github.sha }} .

            - name: Demarrer le conteneur
              run: |
                docker run -d --name films-api \
                    -p 127.0.0.1:8000:8000 \
                    films-api:${{ github.sha }}

            - name: Verifier que l'API demarre
              run: |
                curl --fail --show-error \
                    --retry 30 \
                    --retry-delay 2 \
                    --retry-all-errors \
                    --connect-timeout 2 \
                    --max-time 5 \
                    http://127.0.0.1:8000/health
            - name: Afficher les logs
              if: always()
              run: docker logs films-api

            - name: Arreter le conteneur
              if: always()
              run: docker rm -f films-api